[workspace]
resolver = "3"
members = ["src/rust/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
nt-kernel = { path = "src/rust/nt-kernel" }
# Fork aphrody-labs/windows-rs épinglé par commit (0.100/0.101 non publiés sur crates.io) : portable, sans chemin local.
windows = { git = "https://github.com/aphrody-labs/windows-rs", rev = "8ca69fdaa9d69c78b9bcfbee96c6916f2282e7f0", default-features = false }
windows-window = { git = "https://github.com/aphrody-labs/windows-rs", rev = "8ca69fdaa9d69c78b9bcfbee96c6916f2282e7f0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_unsafe_on_extern = "deny"
static_mut_refs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
many_single_char_names = "allow"
similar_names = "allow"

# Modèle microsoft/edit + microsoft/openvmm (docs/plan/01-stack.md)
[profile.dev]
panic = "abort"
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.wasm]
inherits = "release"
opt-level = 3
debug = false
strip = "symbols"
